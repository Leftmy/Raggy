services:
  vector_db:
    image: qdrant/qdrant:v1.11.0
    container_name: rag_vector_db
    restart: unless-stopped
    volumes:
      - vector_db_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_fastapi_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - VECTOR_STORE_HOST=vector_db
      - VECTOR_STORE_PORT=6333
    depends_on:
      vector_db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VECTOR_STORE_HOST=vector_db
      - VECTOR_STORE_PORT=6333
    depends_on:
      vector_db:
        condition: service_healthy
    command: python -m src.bot.runner
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  vector_db_storage:
