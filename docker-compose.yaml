version: '3.8'

services:
  vector_db:
    image: qdrant/qdrant:v1.11.0
    container_name: rag_vector_db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - vector_db_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTOR_STORE_HOST=vector_db
      - VECTOR_STORE_PORT=6333
    depends_on:
      - vector_db
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VECTOR_STORE_HOST=vector_db
      - VECTOR_STORE_PORT=6333
    depends_on:
      - vector_db
      - api
    command: python -m src.bot.runner

volumes:
  vector_db_storage:
